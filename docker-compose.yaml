services:
  claude-code:
    build: .
    user: node
    stdin_open: true
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - ANTHROPIC_API_KEY
      - COLORTERM=truecolor
      - CLAUDE_CODE_IDE_HOST_OVERRIDE=host.docker.internal
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - ~/.claude:/home/node/.claude
      - ~/.claude.json:/home/node/.claude.json
      - /data/claude-code/tmp:/tmp
      - /home/alien/.projects/ops/claude-code-docker:/claude-code-docker
      # `claude update` drops a new binary in versions/ and repoints the
      # bin/claude symlink at it. Both are in the image, so without these
      # named volumes every update dies with the container. Named (not bind)
      # mounts so Docker seeds them from the image on first use.
      - claude-cli-bin:/home/node/.local/bin
      - claude-cli-versions:/home/node/.local/share/claude
      # Crate downloads, so each `run --rm` doesn't refetch from crates.io.
      - cargo-registry:/home/node/.cargo/registry

volumes:
  claude-cli-bin:
  claude-cli-versions:
  cargo-registry:
